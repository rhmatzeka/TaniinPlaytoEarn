name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taniin_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: >-
          flutter build web --release --wasm --base-href /main/
          --dart-define=TANIIN_COIN_CONTRACT_ADDRESS=${{ vars.TANIIN_COIN_CONTRACT_ADDRESS }}
          --dart-define=TANIIN_LAND_CONTRACT_ADDRESS=${{ vars.TANIIN_LAND_CONTRACT_ADDRESS }}
          --dart-define=TANIIN_ITEMS_CONTRACT_ADDRESS=${{ vars.TANIIN_ITEMS_CONTRACT_ADDRESS }}
          --dart-define=TANIIN_MULTIPLAYER_URL=${{ vars.TANIIN_MULTIPLAYER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: taniin_flutter/build/web
          retention-days: 7
