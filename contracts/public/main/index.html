<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) { registration.unregister(); });
      });
    }
  </script>
  <base href="/main/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Taniin farming game prototype with Sepolia Web3 hooks.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taniin">
  <meta name="theme-color" content="#17351f">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/assets/images/iconaplikasi.png">
  <title>Taniin</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17351f;
      color: #fff0cf;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: none;
    }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(10, 28, 16, 0.38), rgba(10, 28, 16, 0.38)),
        url("assets/assets/images/loadingscreen.jpg") center / cover no-repeat,
        #17351f;
    }

    @font-face {
      font-family: "Pixelify";
      src: url("assets/assets/fonts/PixelifySans.ttf") format("truetype");
      font-display: swap;
    }

    .boot__card {
      display: grid;
      justify-items: center;
      gap: 10px;
      padding: 22px 30px 20px;
      background: #a34a1c;
      border: 4px solid #25140a;
      box-shadow: inset 0 0 0 4px #e07b20, 0 8px 0 #25140a;
      text-align: center;
    }

    .boot__card img {
      width: 72px;
      height: 72px;
      border: 3px solid #25140a;
      border-radius: 12px;
    }

    .boot__title {
      font: 700 36px/1 "Pixelify", monospace;
      color: #ffde19;
      text-shadow: 0 3px 0 #4a1d08;
    }

    .boot__bar {
      width: 180px;
      height: 14px;
      border: 3px solid #25140a;
      background: #4a1d08;
      overflow: hidden;
    }

    .boot__bar span {
      display: block;
      width: 40%;
      height: 100%;
      background: repeating-linear-gradient(90deg, #86e276 0 10px, #2f7d45 10px 14px);
      animation: boot-jalan 1.1s steps(8) infinite;
    }

    .boot__label {
      font-size: 15px;
      font-weight: 700;
      color: #fff0d4;
    }

    @keyframes boot-jalan {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot__bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="boot" role="status">
    <div class="boot__card">
      <img src="assets/assets/images/iconaplikasi.png" alt="">
      <div class="boot__title">Taniin</div>
      <div class="boot__bar"><span></span></div>
      <div class="boot__label">Memuat kebun…</div>
    </div>
  </div>
  <script>
    window.taniinLastEthereumError = '';

    window.taniinHasEthereumProvider = function () {
      return false;
    };

    window.taniinEthereumError = function () {
      return window.taniinLastEthereumError || '';
    };

    window.taniinRequestEthereumAccount = async function () {
      window.taniinLastEthereumError = '';
      const ethereum = window.ethereum;
      if (!ethereum || typeof ethereum.request !== 'function') {
        window.taniinLastEthereumError = 'Wallet browser Ethereum tidak terdeteksi di browser ini.';
        return '';
      }

      try {
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        const account = accounts && accounts[0] ? String(accounts[0]) : '';
        if (!account) {
          window.taniinLastEthereumError = 'Wallet tidak mengirim public address.';
          return '';
        }

        try {
          const chainId = await ethereum.request({ method: 'eth_chainId' });
          if (chainId !== '0xaa36a7') {
            await ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: '0xaa36a7' }],
            });
          }
        } catch (switchError) {
          if (switchError && switchError.code === 4902) {
            try {
              await ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                  chainId: '0xaa36a7',
                  chainName: 'Sepolia',
                  nativeCurrency: { name: 'Sepolia Ether', symbol: 'ETH', decimals: 18 },
                  rpcUrls: ['https://ethereum-sepolia-rpc.publicnode.com'],
                  blockExplorerUrls: ['https://sepolia.etherscan.io'],
                }],
              });
            } catch (_) {}
          }
        }

        return account;
      } catch (error) {
        window.taniinLastEthereumError = error && error.message
          ? error.message
          : 'Connect wallet dibatalkan.';
        return '';
      }
    };

    window.taniinSendEthereum = async function (from, to, valueHex) {
      window.taniinLastEthereumError = '';
      try {
        return String(await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{ from: from, to: to, value: valueHex }],
        }));
      } catch (error) {
        window.taniinLastEthereumError = error && error.message
          ? error.message
          : 'Transfer ETH dibatalkan.';
        return '';
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
