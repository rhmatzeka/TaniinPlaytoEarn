<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Taniin farming game prototype with Sepolia Web3 hooks.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taniin">
  <meta name="theme-color" content="#17351f">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/assets/images/idle.png">
  <title>Taniin</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17351f;
      color: #fff0cf;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: none;
    }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(10, 28, 16, 0.38), rgba(10, 28, 16, 0.38)),
        url("assets/assets/images/loadingscreen.jpg") center / cover no-repeat,
        #17351f;
    }

    .boot__label {
      padding: 10px 14px;
      border: 2px solid #f0ad45;
      background: rgba(61, 40, 25, 0.92);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="boot" aria-hidden="true">
    <div class="boot__label">Loading Taniin...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
